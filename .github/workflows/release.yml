name: Build and release

# Every push builds wavvie for Windows and Linux, after running the tests on each. Pushing a version tag
# (for example v1.0.0) also publishes both builds as a GitHub release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            app: dist/wavvie.exe
            asset: wavvie-windows-x64.exe
          - name: Linux
            os: ubuntu-22.04  # an older glibc, so the build runs on more distributions
            app: dist/wavvie
            asset: wavvie-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python .github/scripts/ci.py test

      - name: Build
        run: python .github/scripts/ci.py build

      - name: Launch the build once
        run: python .github/scripts/ci.py smoke ${{ matrix.app }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/wavvie.exe ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist wavvie

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Windows:** download `wavvie-windows-x64.exe` and run it. The app isn't code-signed, so Windows may say it's from an unknown publisher: choose **More info**, then **Run anyway**.

          **Linux (x86-64):** download `wavvie-linux-x86_64.tar.gz`, then run `tar -xzf wavvie-linux-x86_64.tar.gz && ./wavvie`. If Qt reports that it can't load the "xcb" platform plugin, install `libxcb-cursor0` (Debian, Ubuntu) or `xcb-util-cursor` (Fedora, Arch).

          Keep wavvie in a folder you can write to: it saves its settings file and sign-in beside itself. You'll need your own Spotify app; the first run walks you through creating one.
          EOF
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "wavvie ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
